# OpenWrt Target Definition: mediatek-filogic
# MediaTek Filogic 8x0 (MT798x) - ARM64 Cortex-A53

name: mediatek-filogic
board: mediatek
subtarget: filogic
description: "MediaTek Filogic 8x0 (MT798x) ARM based boards"

arch: aarch64

cpu:
  type: cortex-a53
  endian: little

toolchain:
  libc: musl
  gcc_version: "14.3.0"
  binutils_version: "2.44"
  target_tuple: aarch64-openwrt-linux-musl
  cflags:
    - "-Os"
    - "-pipe"
    - "-mcpu=cortex-a53"
  ldflags: []

# Kernel configuration (base version from packages/linux)
kernel:
  # Use original OpenWrt config (kmod options added dynamically)
  config_fragments:
    - config-6.12
  # Target-specific patches (from parent target dir)
  patch_dirs:
    - ../patches-6.12
  # DTS files location (still from OpenWrt source for now)
  dts_dir: ${OPENWRT_DIR}/target/linux/mediatek/dts
  # Load addresses for this SoC
  load_address: "0x44000000"
  entry_address: "0x44000000"

features:
  - dt-overlay
  - emmc
  - fpu
  - gpio
  - nand
  - pci
  - pcie
  - rootfs-part
  - separate_ramdisk
  - squashfs
  - usb

# Default packages for the target (from mediatek/Makefile + filogic/target.mk)
default_packages:
  - base-files
  - busybox
  - dropbear
  - fitblk
  - kmod-leds-gpio
  - kmod-gpio-button-hotplug
  - wpad-basic-mbedtls
  - uboot-envtools
  # TODO: These packages need additional work:
  # - kmod-crypto-hw-safexcel  # Requires eip197-mini-firmware package + crypto deps

profiles:
  # =========================================================================
  # OpenWrt One - The official OpenWrt reference hardware
  # =========================================================================
  - name: openwrt_one
    title: "OpenWrt One"
    vendor: OpenWrt
    model: One
    default: true

    # Device Tree
    dts: mt7981b-openwrt-one
    dts_dir: "${OPENWRT_DIR}/target/linux/mediatek/dts"
    dtc_flags:
      - "--pad"
      - "4096"
    dts_load_address: "0x43f00000"

    # Device-specific packages
    packages:
      # WiFi
      - kmod-mt7915e
      - kmod-mt7981-firmware
      - mt7981-wo-firmware
      # RTC
      - kmod-rtc-pcf8563
      # USB
      - kmod-usb3
      # Ethernet PHY (2.5G Airoha EN8811H)
      - kmod-phy-airoha-en8811h

    # Hardware specifications
    hardware:
      soc: MT7981B
      ram: 1GB DDR4
      flash:
        nand: 256MB SPI-NAND
        nor: 16MB SPI-NOR
      wifi:
        - band: 2.4GHz
          standard: 802.11ax
          streams: 2x2
        - band: 5GHz
          standard: 802.11ax
          streams: 3x3
      ethernet:
        wan: 2.5GbE (Airoha EN8811H PHY)
        lan: 1GbE (internal PHY)
      usb: USB 2.0
      buttons:
        - name: user
          gpio: 0
        - name: reset
          gpio: 1
      leds:
        - name: status_white
          type: pwm
          function: boot
        - name: status_green
          type: pwm
          function: running
        - name: status_red
          type: gpio
          gpio: 9
          function: failsafe
        - name: lan_amber
          type: gpio
          gpio: 34
        - name: lan_green
          type: gpio
          gpio: 35
      expansion:
        - mikroBUS socket
        - M.2 Key-B (PCIe + USB)

    # Flash layout
    partitions:
      nand:
        - name: bl2
          offset: "0x0"
          size: "0x100000"
          readonly: true
        - name: ubi
          offset: "0x100000"
          size: "0xFF00000"
          filesystem: ubi
      nor:
        - name: bl2-nor
          offset: "0x0"
          size: "0x40000"
        - name: factory
          offset: "0x40000"
          size: "0xc0000"
          readonly: true
        - name: fip-nor
          offset: "0x100000"
          size: "0x80000"
        - name: recovery
          offset: "0x180000"
          size: "0xc80000"

    # UBI configuration
    ubi:
      blocksize: 128k
      pagesize: 2048
      options: "-E 5"
      volumes:
        - name: fip
          image: "${STAGING_DIR_IMAGE}/mt7981_openwrt_one-snand-u-boot.fip"
        - name: recovery
          image: "initramfs.itb"
          optional: true
        # fit volume is added automatically by content: sysupgrade.itb

    # UBIFS configuration (for NAND-based rootfs images)
    # Used when filesystem: ubifs is specified
    ubifs:
      max_leb_cnt: 2048       # Maximum logical erase blocks
      compression: zlib       # Compression: none, lzo, zlib

    # JFFS2 configuration (for NOR/NAND rootfs or overlay images)
    # Used when filesystem: jffs2 is specified
    jffs2:
      erase_block: 128k       # Erase block size
      page_size: 2048         # NAND page size (omit for NOR flash)
      no_cleanmarkers: true   # For NAND/UBI usage

    # Image generation
    images:
      # Main sysupgrade image (UBI + FIT)
      - name: sysupgrade.itb
        type: sysupgrade
        filesystem: squashfs
        kernel:
          format: fit
          compression: gzip
          load_address: "0x44000000"
        rootfs:
          type: external
          pad: true
        metadata: true

      # Initramfs for recovery
      - name: initramfs.itb
        type: initramfs
        kernel:
          format: fit
          compression: lzma
          load_address: "0x44000000"
        pad_to: 64k

      # UBIFS rootfs image (for writable root on NAND)
      - name: rootfs.ubifs
        type: rootfs
        filesystem: ubifs

      # JFFS2 rootfs image (for NOR flash or overlay)
      - name: rootfs.jffs2
        type: rootfs
        filesystem: jffs2

    # Boot artifacts (preloader, U-Boot, etc.)
    artifacts:
      # NOR flash boot chain
      - name: nor-preloader.bin
        type: bl2
        variant: nor-ddr4
      - name: nor-bl31-uboot.fip
        type: fip
        variant: openwrt_one-nor

      # NAND (SPI-NAND) boot chain
      - name: snand-preloader.bin
        type: bl2
        variant: spim-nand-ubi-ddr4
      - name: snand-bl31-uboot.fip
        type: fip
        variant: openwrt_one-snand

      # Factory images
      - name: factory.ubi
        type: ubi
        content: sysupgrade.itb

      - name: snand-factory.bin
        type: combined
        description: "Complete SPI-NAND factory image with redundant BL2"
        parts:
          - type: bl2
            variant: spim-nand-ubi-ddr4
            pad_to: 256k
          - type: bl2
            variant: spim-nand-ubi-ddr4
            pad_to: 256k
          - type: bl2
            variant: spim-nand-ubi-ddr4
            pad_to: 256k
          - type: bl2
            variant: spim-nand-ubi-ddr4
            pad_to: 256k
          - type: ubi
            content: sysupgrade.itb

      - name: nor-factory.bin
        type: combined
        description: "Complete NOR factory image with recovery"
        parts:
          - type: bl2
            variant: nor-ddr4
            pad_to: 256k
          - type: eeprom
            name: openwrt-one-eeprom
            pad_to: 768k  # total 1024k from start
          - type: fip
            variant: openwrt_one-nor
            pad_to: 512k
          - type: image
            source: initramfs.itb

  # =========================================================================
  # ABT ASR3000 - Budget MT7981B router (for testing)
  # =========================================================================
  - name: abt_asr3000
    title: "ABT ASR3000"
    vendor: ABT
    model: ASR3000

    # Device Tree
    dts: mt7981b-abt-asr3000
    dts_dir: "${OPENWRT_DIR}/target/linux/mediatek/dts"
    dts_load_address: "0x43f00000"

    # Device-specific packages (WiFi packages commented - require kernel module build)
    packages: []
      # - kmod-mt7915e
      # - kmod-mt7981-firmware
      # - mt7981-wo-firmware

    # Hardware specifications
    hardware:
      soc: MT7981B
      ram: 512MB DDR3
      flash:
        nand: 128MB SPI-NAND
      wifi:
        - band: 2.4GHz
          standard: 802.11ax
          streams: 2x2
        - band: 5GHz
          standard: 802.11ax
          streams: 2x2
      ethernet:
        wan: 1GbE
        lan: 3x 1GbE

    # UBI configuration (same as OpenWrt One)
    ubi:
      blocksize: 128k
      pagesize: 2048
      options: "-E 5"
      volumes:
        - name: fip
          image: "${STAGING_DIR_IMAGE}/mt7981_abt_asr3000-u-boot.fip"
        - name: recovery
          image: "initramfs.itb"
          optional: true

    # UBIFS configuration
    ubifs:
      max_leb_cnt: 1024
      compression: zlib

    # Image generation
    images:
      - name: sysupgrade.itb
        type: sysupgrade
        filesystem: squashfs
        kernel:
          format: fit
          compression: gzip
          load_address: "0x44000000"
        rootfs:
          type: external
          pad: true
        metadata: true

      - name: initramfs.itb
        type: initramfs
        kernel:
          format: fit
          compression: lzma
          load_address: "0x44000000"
        pad_to: 64k

    # Boot artifacts
    artifacts:
      - name: snand-preloader.bin
        type: bl2
        variant: spim-nand-ddr3

      - name: snand-bl31-uboot.fip
        type: fip
        variant: abt_asr3000

image:
  filesystems:
    - squashfs
    - ubifs
    - jffs2
    - initramfs
  kernel_name: Image
  kernel_in_ubi: true
  ubootenv_in_ubi: true
