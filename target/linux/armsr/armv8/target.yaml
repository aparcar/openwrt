# OpenWrt Target Definition: armsr-armv8
# ARM SystemReady (EFI) compliant - 64-bit ARMv8

name: armsr-armv8
board: armsr
subtarget: armv8
description: "ARM SystemReady (EFI) compliant 64-bit machines"

arch: aarch64

cpu:
  type: generic
  endian: little

toolchain:
  libc: musl
  gcc_version: "14.3.0"
  binutils_version: "2.44"
  target_tuple: aarch64-openwrt-linux-musl
  cflags:
    - "-Os"
    - "-pipe"
  ldflags: []

# Kernel configuration (base version from packages/linux)
kernel:
  # Use original OpenWrt config (kmod options added dynamically)
  config_fragments:
    - config-6.12
  # Target-specific patches (from parent target dir)
  patch_dirs:
    - ../patches-6.12
  # No DTS for EFI systems (uses ACPI)
  dts_dir: null
  # Load addresses for this target
  load_address: "0x40080000"
  entry_address: "0x40080000"
  # EFI stub support
  efi_stub: true

features:
  - fpu
  - pci
  - pcie
  - rtc
  - usb
  - ext4
  - squashfs
  - ramdisk

# Default packages for bootable system
default_packages:
  # Core system (essential for boot)
  - base-files      # Filesystem structure, init scripts
  - busybox         # Shell, core utilities
  - libc            # C library (from toolchain)
  # procd init system and dependencies
  - libjson-c       # JSON parsing library
  - libubox         # Base utility library (from libubox source)
  - libblobmsg-json # JSON blob handling (from libubox source)
  - libjson-script  # JSON scripting (from libubox source)
  - jshn            # JSON shell notation (from libubox source)
  - libubus         # ubus library (from ubus source)
  - ubusd           # ubus daemon (from ubus source)
  - ubus            # ubus client (from ubus source)
  - libuci          # UCI library (from uci source)
  - uci             # UCI client (from uci source)
  - libudebug       # Debug library (from udebug source)
  - ubox            # System helper toolbox (from ubox source)
  - logd            # System logging (from ubox source)
  - getrandom       # Random number helper (from ubox source)
  - procd           # Init/process manager
  - fstools         # Filesystem tools (mount_root for preinit)
  # ucode and modules (required by netifd and procd)
  - ucode           # Tiny scripting language
  - libucode        # ucode runtime library
  - ucode-mod-fs    # ucode filesystem module
  - ucode-mod-ubus  # ucode ubus module
  - ucode-mod-uci   # ucode UCI module
  - ucode-mod-uloop # ucode uloop module
  # Network configuration
  - libnl-tiny      # Netlink library (netifd dependency)
  - netifd          # Network interface daemon
  # TLS/SSL support (for APK and network)
  - libmbedtls      # TLS/crypto library
  - libustream-mbedtls  # TLS stream for libubox
  - libuclient      # HTTP client library
  - uclient-fetch   # wget replacement
  - ca-bundle       # CA certificates
  # Package management
  - apk             # APK package manager
  # Random number generation
  - urandom-seed    # Random seed management
  - urngd           # Hardware RNG daemon
  # Network services
  - dropbear        # SSH server
  - zlib            # Compression library (dropbear dependency)
  - dnsmasq         # DNS/DHCP server
  - odhcpd          # DHCPv4/DHCPv6/RA server

# Device profiles are loaded from profiles/*.yaml
# See profiles/generic.yaml, profiles/generic-initramfs.yaml

image:
  filesystems:
    - ext4
    - squashfs
    - initramfs
  kernel_name: Image
  # EFI boot path for aarch64
  efi_boot_file: bootaa64.efi
  cmdline: "earlycon console=ttyAMA0"
