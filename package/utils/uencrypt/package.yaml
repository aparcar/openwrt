# uencrypt - Small encryption/decryption utility
# Synced with OpenWrt package/utils/uencrypt/Makefile

name: uencrypt
version: "1"
release: 5
license: GPL-2.0-or-later

# Local source in src/ directory
source:
  type: local
  path: src

metadata:
  section: utils
  category: Base system
  title: Small Decryption utility
  description: |
    This is a small encryption/decryption program. It defaults to AES-128-CBC,
    but supports any encryption provided by the crypto library. Even though it
    can be used for non-critical regular encryption and decryption operations,
    it is included here to decrypt the configuration from mtd on some devices.

    Note: Key and IV are exposed on command line.
  maintainer: Eneas U de Queiroz <cotequeiroz@gmail.com>

dependencies:
  runtime: []
  build: []

build:
  system: cmake
  parallel: true
  cflags: "-Wall"

# Three variants for different crypto backends
variants:
  mbedtls:
    package_name: uencrypt-mbedtls
    description: "Small encryption utility using mbedTLS"
    default: true
    dependencies:
      runtime:
        - libmbedtls
      build:
        - libmbedtls-dev
    cmake_options:
      - "-DUSE_MBEDTLS=1"
    conflicts:
      - uencrypt-openssl
      - uencrypt-wolfssl

  openssl:
    package_name: uencrypt-openssl
    description: "Small encryption utility using OpenSSL"
    dependencies:
      runtime:
        - libopenssl
      build:
        - libopenssl-dev
    conflicts:
      - uencrypt-mbedtls
      - uencrypt-wolfssl

  wolfssl:
    package_name: uencrypt-wolfssl
    description: "Small encryption utility using wolfSSL"
    dependencies:
      runtime:
        - libwolfssl
      build:
        - libwolfssl-dev
    cmake_options:
      - "-DUSE_WOLFSSL=1"
    conflicts:
      - uencrypt-mbedtls
      - uencrypt-openssl

install:
  files:
    - src: "usr/bin/uencrypt"
      dst: "/usr/bin/uencrypt"
      mode: "0755"
