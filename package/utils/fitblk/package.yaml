# fitblk - FIT block device release tool
# Used for UBI+FIT rootfs handling on MediaTek and similar platforms

name: fitblk
version: "1"
release: 2
license: GPL-2.0-only
maintainer: Daniel Golle <daniel@makrotopia.org>

source:
  type: local

metadata:
  section: base
  category: Base system
  title: fitblk firmware release tool
  description: |
    Release uImage.FIT block devices using ioctl.
    Used for sysupgrade on devices with FIT+UBI rootfs.

dependencies:
  runtime: []
  build:
    - kernel

build:
  system: make
  # Include kernel headers for linux/fitblk.h
  env:
    CFLAGS: "-Os -Wall -Werror -I${LINUX_DIR}/include/uapi -I${LINUX_DIR}/include"
  # Custom install since Makefile has no install target
  install_script: |
    install -d ${DESTDIR}/usr/sbin
    install -m 0755 fitblk ${DESTDIR}/usr/sbin/

install:
  dirs:
    - /usr/sbin
    - /lib/upgrade
  files:
    # fitblk binary is installed by make install
    - src: "${pkg_dir}/files/fit.sh"
      dst: "/lib/upgrade/fit.sh"
      mode: "0644"
