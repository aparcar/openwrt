# libnftnl - Low-level netlink library for nf_tables
# Synced with OpenWrt package/libs/libnftnl/Makefile

name: libnftnl
version: "1.3.1"
release: 1
license: GPL-2.0-or-later

source:
  type: tarball
  url: "https://netfilter.org/projects/libnftnl/files/libnftnl-1.3.1.tar.xz"
  sha256: "607da28dba66fbdeccf8ef1395dded9077e8d19f2995f9a4d45a9c2f0bcffba8"

metadata:
  section: libs
  category: Libraries
  title: Low-level netlink library for the nf_tables subsystem
  description: |
    libnftnl is a userspace library providing a low-level netlink
    programming interface (API) to the in-kernel nf_tables subsystem.

dependencies:
  build:
    - libmnl-dev
  runtime:
    - libmnl

build:
  system: autotools
  parallel: true
  configure_args:
    - "--enable-static"
    - "--enable-shared"

files:
  - src: "usr/lib/libnftnl.so*"
    dst: "/usr/lib/"
