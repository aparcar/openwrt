# zlib - Compression library
# Synced with OpenWrt package/libs/zlib/Makefile

name: zlib
version: "1.3.1"
release: 1
license: Zlib

source:
  type: git
  url: "https://github.com/madler/zlib"
  version: "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf"
  sha256: "6558577038f4839057fad93afb295bf32e84dc9bd2c33512d40a5eab6d4889ef"

metadata:
  section: libs
  category: Libraries
  title: Library implementing the deflate compression method
  description: |
    zlib is a lossless data-compression library.
    This package includes the shared library.
  url: https://www.zlib.net/

dependencies:
  runtime: []
  build: []

build:
  system: cmake
  parallel: true
  # OpenWrt enables ARM NEON optimizations when available
  configure_args:
    - "-DARMv8=ON"

install:
  files:
    - src: "${build_dir}/libz.so"
      dst: "/usr/lib/libz.so"
      mode: "0755"
    - src: "${build_dir}/libz.so.1"
      dst: "/usr/lib/libz.so.1"
      mode: "0755"
    - src: "${build_dir}/libz.so.1.3.1"
      dst: "/usr/lib/libz.so.1.3.1"
      mode: "0755"
  headers:
    - src: "${src_dir}/zlib.h"
      dst: "/usr/include/zlib.h"
    - src: "${build_dir}/zconf.h"
      dst: "/usr/include/zconf.h"
