# ustream-ssl - SSL stream library for libubox
# Synced with OpenWrt package/libs/ustream-ssl/Makefile

name: ustream-ssl
version: "2024.07.28"
release: 1
license: ISC

source:
  type: git
  url: "https://git.openwrt.org/project/ustream-ssl.git"
  version: "99bd3d2b167ccdffb6de072d02c380cb37b23e33"
  sha256: "d3a07151ec361cc4483406a6d01ebbf6ddf627e54f5a5b6676f265614797ee84"

metadata:
  section: libs
  category: Libraries
  title: ustream SSL Library
  description: |
    SSL stream abstraction library for libubox, providing TLS support
    for ubus and other OpenWrt components.
  maintainer: Felix Fietkau <nbd@nbd.name>

dependencies:
  runtime:
    - libubox
  build:
    - libubox-dev

build:
  system: cmake
  parallel: true

install:
  files:
    - src: "usr/lib/libustream-ssl.so"
      dst: "/lib/libustream-ssl.so"

# Variants allow building the same source with different SSL backends.
# Each variant produces a separate binary package with its own dependencies
# and build options. Only one variant can be installed at a time.
variants:
  mbedtls:
    package_name: libustream-mbedtls
    description: "ustream SSL library (mbedtls)"
    default: true
    dependencies:
      runtime:
        - libmbedtls
      build:
        - libmbedtls-dev
    cmake_options:
      - "-DMBEDTLS=on"
    conflicts:
      - libustream-openssl
      - libustream-wolfssl

  openssl:
    package_name: libustream-openssl
    description: "ustream SSL library (openssl)"
    dependencies:
      runtime:
        - libopenssl
      build:
        - libopenssl-dev
    conflicts:
      - libustream-mbedtls
      - libustream-wolfssl

  wolfssl:
    package_name: libustream-wolfssl
    description: "ustream SSL library (wolfssl)"
    dependencies:
      runtime:
        - libwolfssl
      build:
        - libwolfssl-dev
    cflags:
      - "-I${STAGING_DIR}/usr/include/wolfssl"
    cmake_options:
      - "-DWOLFSSL=on"
    conflicts:
      - libustream-mbedtls
      - libustream-openssl
