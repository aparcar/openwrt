# libmnl - Minimalistic user-space library for Netlink
# Synced with OpenWrt package/libs/libmnl/Makefile

name: libmnl
version: "1.0.5"
release: 1
license: LGPL-2.1+

source:
  type: tarball
  url: "http://www.netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2"
  sha256: "274b9b919ef3152bfb3da3a13c950dd60d6e2bcd54230ffeca298d03b40d0525"

metadata:
  section: libs
  category: Libraries
  title: Minimalistic user-space library for Netlink
  description: |
    libmnl is a minimalistic user-space library oriented to Netlink developers.
    It provides simple helpers for Netlink socket handling, message building,
    validating, parsing and sequence tracking.

build:
  system: autotools
  parallel: true
  fixup: autoreconf
  configure_args:
    - "--enable-shared"
    - "--enable-static"

files:
  - src: "usr/lib/libmnl.so*"
    dst: "/usr/lib/"
