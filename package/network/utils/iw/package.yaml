# iw - cfg80211 interface configuration utility
# Synced with OpenWrt package/network/utils/iw/Makefile

name: iw
version: "6.17"
release: 1
license: GPL-2.0

source:
  type: tarball
  url: "https://mirrors.edge.kernel.org/pub/software/network/iw/iw-6.17.tar.xz"
  sha256: "7d182e498289ab39b257da6780d562e415377107f50358ee5b55b8cfe40b1e33"

metadata:
  section: net
  category: Network
  title: cfg80211 interface configuration utility
  description: |
    iw is a new nl80211 based CLI configuration utility for wireless devices.
    It supports all new drivers that have been added to the kernel recently.

dependencies:
  build:
    - libnl-tiny-dev
  runtime:
    - libnl-tiny

build:
  system: make
  parallel: true
  # iw needs a version.c file created during configure
  pre_build: |
    echo 'const char iw_version[] = "6.17";' > version.c
    echo '#!/bin/sh' > version.sh
    chmod +x version.sh
  make_args:
    - "NL1FOUND="
    - "NL2FOUND=Y"
    - "NLLIBNAME=libnl-tiny"
    - "LIBS=-lm -lnl-tiny"
    - "V=1"
  cppflags:
    - "-I${STAGING_DIR}/usr/include/libnl-tiny"
    - "-DCONFIG_LIBNL20"
    - "-D_GNU_SOURCE"

files:
  - src: "iw"
    dst: "/usr/sbin/"
