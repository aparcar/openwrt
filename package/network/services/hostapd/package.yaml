# hostapd/wpa_supplicant - IEEE 802.1x Authenticator/Supplicant
# Synced with OpenWrt package/network/services/hostapd/Makefile
# This is the wpad-basic-mbedtls variant (default)

name: hostapd
version: "2025.08.26"
release: 1
license: BSD-3-Clause

source:
  type: git
  url: "https://w1.fi/hostap.git"
  version: "ca266cc24d8705eb1a2a0857ad326e48b1408b20"
  sha256: "59ac677093f524ff98588abd9f33805a336a6e929d6814222f0d784c854f2343"

metadata:
  section: net
  category: Network
  title: IEEE 802.1x Authenticator/Supplicant (mbedTLS basic)
  description: |
    This package contains hostapd (access point daemon) and wpa_supplicant
    (client) with WPA-PSK, 802.11r and 802.11w support using mbedTLS.

dependencies:
  build:
    - libnl-tiny-dev
    - libubox-dev
    - libubus-dev
    - libucode-dev
    - libudebug-dev
    - libmbedtls-dev
    - libjson-c-dev
  runtime:
    - libnl-tiny
    - libubox
    - libubus
    - libucode
    - libudebug
    - libmbedtls
    - libjson-c

build:
  system: custom
  parallel: true
  cppflags:
    - "-I${STAGING_DIR}/usr/include/libnl-tiny"
    - "-DCONFIG_LIBNL20"
    - "-D_GNU_SOURCE"
  ldflags:
    - "-lubox"
    - "-lubus"
    - "-lblobmsg_json"
    - "-lucode"
    - "-lm"
    - "-lnl-tiny"
    - "-ludebug"
    - "-lmbedcrypto"
    - "-lmbedx509"
    - "-lmbedtls"
  # Custom build steps - hostapd uses config files not configure
  configure_script: |
    PKG_DIR="${OPENWRT_DIR}/package/network/services/hostapd"
    # Copy build config files
    cp ${PKG_DIR}/files/hostapd-basic.config hostapd/.config
    cp ${PKG_DIR}/files/wpa_supplicant-basic.config wpa_supplicant/.config
    # Copy OpenWrt-specific source files (ubus/ucode support)
    # Copy src files to corresponding locations
    cp ${PKG_DIR}/src/src/ap/*.c src/ap/
    cp ${PKG_DIR}/src/src/ap/*.h src/ap/
    cp ${PKG_DIR}/src/src/utils/*.c src/utils/
    cp ${PKG_DIR}/src/src/utils/*.h src/utils/
    # Copy extra hostapd files (radius.c)
    cp ${PKG_DIR}/src/hostapd/*.c hostapd/
    # Copy wpa_supplicant ucode files
    cp ${PKG_DIR}/src/wpa_supplicant/*.c wpa_supplicant/
    cp ${PKG_DIR}/src/wpa_supplicant/*.h wpa_supplicant/
    # Enable mbedtls, SAE (WPA3), ubus and ucode support
    echo "CONFIG_TLS=mbedtls" >> hostapd/.config
    echo "CONFIG_SAE=y" >> hostapd/.config
    echo "CONFIG_OWE=y" >> hostapd/.config
    echo "CONFIG_UBUS=y" >> hostapd/.config
    echo "CONFIG_UCODE=y" >> hostapd/.config
    echo "CONFIG_TLS=mbedtls" >> wpa_supplicant/.config
    echo "CONFIG_SAE=y" >> wpa_supplicant/.config
    echo "CONFIG_OWE=y" >> wpa_supplicant/.config
    echo "CONFIG_UCODE=y" >> wpa_supplicant/.config
  compile_script: |
    # Use CFLAGS as environment variable that hostapd's Makefile can append to
    export CC="${CROSS_COMPILE}gcc"
    export CFLAGS="-I/staging/usr/include/libnl-tiny -I/staging/usr/include -DCONFIG_LIBNL20 -D_GNU_SOURCE"
    export LIBS="-L/staging/usr/lib -lubox -lubus -lblobmsg_json -lucode -lm -lnl-tiny -ludebug -lmbedcrypto -lmbedx509 -lmbedtls -ljson-c"
    # Build hostapd - don't pass CFLAGS on command line, let Makefile append to env var
    make -C hostapd -j${NPROC} \
      CC="${CC}" \
      LIBS="${LIBS}" \
      hostapd hostapd_cli
    # Build wpa_supplicant
    make -C wpa_supplicant -j${NPROC} \
      CC="${CC}" \
      LIBS="${LIBS}" \
      wpa_supplicant wpa_cli

subpackages:
  hostapd:
    description: "IEEE 802.1x Authenticator (access point)"
    section: net
    dependencies:
      runtime:
        - hostapd-common
        - libnl-tiny
        - libubox
        - libubus
        - libmbedtls
    files:
      # Binaries are in in-tree build dir
      - src: "${src_dir}/hostapd/hostapd"
        dst: "/usr/sbin/hostapd"
        mode: "0755"
      - src: "${src_dir}/hostapd/hostapd_cli"
        dst: "/usr/sbin/hostapd_cli"
        mode: "0755"

  wpa-supplicant:
    description: "WPA Supplicant (client)"
    section: net
    dependencies:
      runtime:
        - hostapd-common
        - libnl-tiny
        - libubox
        - libubus
        - libmbedtls
    files:
      # Binaries are in in-tree build dir
      - src: "${src_dir}/wpa_supplicant/wpa_supplicant"
        dst: "/usr/sbin/wpa_supplicant"
        mode: "0755"
      - src: "${src_dir}/wpa_supplicant/wpa_cli"
        dst: "/usr/sbin/wpa_cli"
        mode: "0755"

  hostapd-common:
    description: "hostapd/wpa_supplicant common support files"
    section: net
    dependencies:
      runtime:
        - libucode
        - ucode-mod-fs
        - ucode-mod-ubus
        - ucode-mod-uci
        - ucode-mod-uloop
        - ucode-mod-log
        - netifd
    files:
      - src: "${pkg_dir}/files/wpad.init"
        dst: "/etc/init.d/wpad"
        mode: "0755"
      - src: "${pkg_dir}/files/hostapd.uc"
        dst: "/lib/netifd/wireless/hostapd.uc"
        mode: "0644"
      - src: "${pkg_dir}/files/wpa_supplicant.uc"
        dst: "/lib/netifd/wireless/wpa_supplicant.uc"
        mode: "0644"
      - src: "${pkg_dir}/files/wpad_acl.json"
        dst: "/usr/share/acl.d/wpad_acl.json"
        mode: "0644"

  # Combined hostapd + wpa_supplicant package (wpad)
  # This is what most users want for a typical WiFi router
  wpad-basic-mbedtls:
    description: |
      IEEE 802.1x Authenticator/Supplicant (mbedTLS, basic variant).
      Combined hostapd and wpa_supplicant with WPA-PSK, SAE (WPA3),
      802.11r, and 802.11w support using mbedTLS for crypto.
    section: net
    provides:
      - wpad
    dependencies:
      runtime:
        - hostapd
        - wpa-supplicant
