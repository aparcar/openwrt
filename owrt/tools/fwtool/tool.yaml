# fwtool - Firmware metadata tool
# Appends/extracts firmware metadata and signatures for sysupgrade images

name: fwtool
version: "2025.10.03"
license: GPL-2.0

source:
  type: git
  url: "https://git.openwrt.org/project/fwtool.git"
  version: "04cd252e4e9394ffacd51f56f1f124abc534f715"
  sha256: "d0c72a6326aa5a5ee8360b0727075643aec63febc4849ab8f13aed315115d7ab"

metadata:
  title: Firmware metadata tool
  description: |
    Utility for appending and extracting firmware metadata and signatures.
    Used by sysupgrade to validate firmware images.

dependencies: []

build:
  system: cmake
  parallel: true
  install_script: |
    install -d "${STAGING_DIR}/bin"
    install -m 0755 fwtool "${STAGING_DIR}/bin/"
