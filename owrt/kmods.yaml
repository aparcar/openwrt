    description: "This module provides support for creating, sealing, and unsealing\n\tkeys in the kernel. Trusted keys are\
      \ random number symmetric keys,\n\tgenerated and RSA-sealed by the TPM. The TPM only unseals the keys,\n\tif the boot\
      \ PCRs and other criteria match.  Userspace will only ever\n\tsee encrypted blobs."
