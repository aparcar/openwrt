  - name: ipt-cluster
    title: Module for matching cluster
    description: "Netfilter (IPv4/IPv6) module for matching cluster\n This option allows you to build work-load-sharing clusters\
      \ of\n network servers/stateful firewalls without having a dedicated\n load-balancing router/server/switch. Basically,\
      \ this match returns\n true when the packet must be handled by this cluster node. Thus,\n all nodes see all packets\
      \ and this match decides which node handles\n what packets. The work-load sharing algorithm is based on source\n address\
      \ hashing.\n\n This module is usable for ipv4 and ipv6.\n\n To use it also enable iptables-mod-cluster\n\n see `iptables\
      \ -m cluster --help` for more information."
    kconfig: []
    files:
    - mod,$(IPT_CLUSTER-m),net/$(mod).ko)
    autoload:
