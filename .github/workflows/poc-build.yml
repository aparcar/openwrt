name: Build System CI

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'owrt/**'
      - 'package/**'
      - 'target/**'
      - '.github/workflows/poc-build.yml'
  pull_request:
    paths:
      - 'owrt/**'
      - 'package/**'
      - 'target/**'
      - '.github/workflows/poc-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/openwrt-build-base
  TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/openwrt-toolchain
  # Default target - armsr-armv8 can be tested with QEMU
  TARGET: armsr-armv8
  PROFILE: generic

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema click

      - name: Validate YAML schemas
        run: |
          python3 -c "
          import json
          import yaml
          from jsonschema import validate, ValidationError
          from pathlib import Path

          # Load schemas
          pkg_schema = json.loads(Path('owrt/schema/package.schema.json').read_text())
          target_schema = json.loads(Path('owrt/schema/target.schema.json').read_text())

          errors = []

          # Validate packages
          for pkg_file in Path('package').rglob('package.yaml'):
              try:
                  data = yaml.safe_load(pkg_file.read_text())
                  validate(data, pkg_schema)
                  print(f'✓ {pkg_file}')
              except Exception as e:
                  errors.append(f'{pkg_file}: {e}')
                  print(f'✗ {pkg_file}: {e}')

          # Validate targets
          for target_file in Path('target').rglob('target.yaml'):
              try:
                  data = yaml.safe_load(target_file.read_text())
                  validate(data, target_schema)
                  print(f'✓ {target_file}')
              except Exception as e:
                  errors.append(f'{target_file}: {e}')
                  print(f'✗ {target_file}: {e}')

          if errors:
              print(f'\n{len(errors)} validation error(s)')
              exit(1)
          print('\nAll schemas valid!')
          "

      - name: Check Python syntax
        run: |
          python -m py_compile owrt/*.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema click pytest

      - name: Run unit tests
        run: |
          python -m pytest owrt/tests/ -v --tb=short

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema click

      - name: Test CLI help
        run: |
          python -m owrt --help
          python -m owrt toolchain --help
          python -m owrt kernel --help
          python -m owrt build --help

      - name: Test target info
        run: |
          python -m owrt info armsr-armv8
          python -m owrt info mediatek-filogic

  build-base-image:
    name: Build Base Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BASE_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-toolchain:
    name: Build Toolchain (aarch64)
    runs-on: ubuntu-latest
    needs: build-base-image
    permissions:
      contents: read
      packages: write
    outputs:
      toolchain-tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema click

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute toolchain hash
        id: hash
        run: |
          # Compute a hash based on toolchain config
          HASH=$(python3 -c "
          import yaml
          import hashlib
          from pathlib import Path
          
          target_file = Path('target/linux/armsr/armv8/target.yaml')
          data = yaml.safe_load(target_file.read_text())
          tc = data.get('toolchain', {})
          h = hashlib.sha256()
          h.update(f\"{tc.get('gcc_version', '')}-{tc.get('libc', '')}-{tc.get('binutils_version', '')}\".encode())
          print(h.hexdigest()[:12])
          ")
          echo "Toolchain hash: $HASH"
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "tag=armsr-armv8-$HASH" >> $GITHUB_OUTPUT

      - name: Check if toolchain image exists
        id: check
        run: |
          TAG="${{ steps.hash.outputs.tag }}"
          IMAGE="${{ env.TOOLCHAIN_IMAGE }}:${TAG}"
          echo "Checking for image: $IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Toolchain image already exists, skipping build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Toolchain image not found, will build"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Pull base image
        if: steps.check.outputs.exists == 'false'
        run: |
          docker pull ${{ env.BASE_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.BASE_IMAGE }}:${{ github.sha }} openwrt-build-base:latest

      - name: Cache toolchain downloads
        if: steps.check.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: dl
          key: toolchain-dl-${{ steps.hash.outputs.hash }}
          restore-keys: |
            toolchain-dl-

      - name: Build toolchain
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dl build/toolchain build/host-staging
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/openwrt \
            -v ${{ github.workspace }}/dl:/build/dl \
            -v ${{ github.workspace }}/build/toolchain:/build/toolchain \
            -w /openwrt \
            -e BUILD_DIR=/build \
            -e DL_DIR=/build/dl \
            -e HOME=/tmp \
            openwrt-build-base:latest \
            python3 -m owrt -v toolchain build ${{ env.TARGET }}

      - name: Build host tools
        if: steps.check.outputs.exists == 'false'
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/openwrt \
            -v ${{ github.workspace }}/dl:/build/dl \
            -v ${{ github.workspace }}/build/host-staging:/build/host-staging \
            -w /openwrt \
            -e BUILD_DIR=/build \
            -e DL_DIR=/build/dl \
            -e HOME=/tmp \
            openwrt-build-base:latest \
            python3 -m owrt -v tool build-all

      - name: Verify toolchain
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "=== Toolchain contents ==="
          ls -la build/toolchain/
          ls -la build/toolchain/${{ env.TARGET }}/bin/ || true
          echo ""
          echo "=== Host tools ==="
          ls -la build/host-staging/bin/ || true
          echo ""
          echo "=== Test cross-compiler ==="
          docker run --rm \
            -v ${{ github.workspace }}/build/toolchain:/build/toolchain \
            openwrt-build-base:latest \
            /build/toolchain/${{ env.TARGET }}/bin/aarch64-openwrt-linux-musl-gcc --version

      - name: Build and push toolchain Docker image
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.check.outputs.tag }}"

          cat > Dockerfile.toolchain-built <<EOF
          ARG BASE_IMAGE
          FROM \${BASE_IMAGE}

          # Copy toolchain and host tools
          COPY --chown=builder:builder build/toolchain/${{ env.TARGET }} /build/toolchain/${{ env.TARGET }}
          COPY --chown=builder:builder build/host-staging /build/host-staging

          ENV PATH="/build/toolchain/${{ env.TARGET }}/bin:/build/host-staging/bin:\${PATH}"
          ENV CROSS_COMPILE="aarch64-openwrt-linux-musl-"
          ENV CC="aarch64-openwrt-linux-musl-gcc"
          ENV CXX="aarch64-openwrt-linux-musl-g++"

          RUN aarch64-openwrt-linux-musl-gcc --version && apk --version
          EOF

          docker build \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ github.sha }} \
            -f Dockerfile.toolchain-built \
            -t ${{ env.TOOLCHAIN_IMAGE }}:${TAG} \
            -t ${{ env.TOOLCHAIN_IMAGE }}:${{ env.TARGET }}-latest \
            .

          docker push ${{ env.TOOLCHAIN_IMAGE }}:${TAG}
          docker push ${{ env.TOOLCHAIN_IMAGE }}:${{ env.TARGET }}-latest

      - name: Report toolchain status
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "✓ Using cached toolchain image: ${{ env.TOOLCHAIN_IMAGE }}:${{ steps.check.outputs.tag }}"
          else
            echo "✓ Built and pushed new toolchain image: ${{ env.TOOLCHAIN_IMAGE }}:${{ steps.check.outputs.tag }}"
          fi

  build-firmware:
    name: Build Firmware (ARMSR)
    runs-on: ubuntu-latest
    needs: build-toolchain
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull toolchain image
        run: |
          TOOLCHAIN_TAG="${{ needs.build-toolchain.outputs.toolchain-tag }}"
          echo "Using toolchain image: ${{ env.TOOLCHAIN_IMAGE }}:${TOOLCHAIN_TAG}"
          docker pull ${{ env.TOOLCHAIN_IMAGE }}:${TOOLCHAIN_TAG}

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: build-dl-${{ hashFiles('package/*/package.yaml') }}
          restore-keys: |
            build-dl-
            toolchain-dl-

      - name: Build firmware
        run: |
          TOOLCHAIN_TAG="${{ needs.build-toolchain.outputs.toolchain-tag }}"
          mkdir -p dl build/output build/packages build/staging build/kernel build/rootfs
          # Note: We mount specific subdirs instead of /build to preserve the
          # toolchain and host tools baked into the image at /build/toolchain/ and /build/host-staging/
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/openwrt \
            -v ${{ github.workspace }}/dl:/build/dl \
            -v ${{ github.workspace }}/build/output:/build/output \
            -v ${{ github.workspace }}/build/packages:/build/packages \
            -v ${{ github.workspace }}/build/staging:/build/staging \
            -v ${{ github.workspace }}/build/kernel:/build/kernel \
            -v ${{ github.workspace }}/build/rootfs:/build/rootfs \
            -w /openwrt \
            -e BUILD_DIR=/build \
            -e DL_DIR=/build/dl \
            -e HOME=/tmp \
            ${{ env.TOOLCHAIN_IMAGE }}:${TOOLCHAIN_TAG} \
            python3 -m owrt -v build ${{ env.TARGET }} -p ${{ env.PROFILE }}

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find build/output -type f -ls 2>/dev/null || true
          echo ""
          echo "=== Firmware images ==="
          ls -la build/output/images/ 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.TARGET }}
          path: build/output/images/
          retention-days: 30
          if-no-files-found: warn

  runtime-tests:
    name: Runtime Tests (QEMU)
    runs-on: ubuntu-latest
    needs: build-firmware
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Clone openwrt-tests
        run: |
          git clone --depth 1 https://github.com/aparcar/openwrt-tests.git openwrt-tests

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ env.TARGET }}
          path: firmware

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-aarch64

      - name: List firmware files
        run: |
          echo "=== Downloaded firmware ==="
          ls -la firmware/ || echo "No firmware files found"

      - name: Find firmware image
        id: firmware
        run: |
          # Find the initramfs kernel for QEMU testing
          FIRMWARE=$(find firmware -name '*-initramfs-kernel.bin' | head -1)
          
          if [ -z "$FIRMWARE" ]; then
            FIRMWARE=$(find firmware -name '*-initramfs*.elf' | head -1)
          fi
          
          if [ -z "$FIRMWARE" ]; then
            FIRMWARE=$(find firmware -name '*.bin' | head -1)
          fi
          
          if [ -z "$FIRMWARE" ]; then
            echo "No bootable firmware image found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found firmware: $FIRMWARE"
          echo "path=$FIRMWARE" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT

      - name: Install test dependencies
        if: steps.firmware.outputs.found == 'true'
        working-directory: openwrt-tests
        run: |
          uv sync

      - name: Run openwrt-tests
        if: steps.firmware.outputs.found == 'true'
        working-directory: openwrt-tests
        run: |
          uv run pytest tests/ \
            --lg-env targets/qemu_armsr-armv8.yaml \
            --lg-log \
            --log-cli-level=INFO \
            --lg-colored-steps \
            --firmware "${{ github.workspace }}/${{ steps.firmware.outputs.path }}" \
            -v \
            --timeout=300 \
            --junit-xml=test-results.xml \
            -x \
            || true  # Don't fail the job on test failures for now

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.firmware.outputs.found == 'true'
        with:
          name: runtime-test-results
          path: |
            openwrt-tests/test-results.xml
            openwrt-tests/*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always() && steps.firmware.outputs.found == 'true'
        with:
          report_paths: openwrt-tests/test-results.xml
          check_name: QEMU Runtime Tests
          fail_on_failure: false
          include_passed: true
